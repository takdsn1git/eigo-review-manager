*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#172033;color:white;padding:20px 16px}.wrap{max-width:1000px;margin:auto;padding:14px}h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;opacity:.75}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;border-radius:13px;padding:12px;border:1px solid #e3e8f0}.stat b{display:block;font-size:25px}.r{border-left:6px solid #e5484d}.y{border-left:6px solid #e8a317}.g{border-left:6px solid #25a55f}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #dce2eb;background:white;padding:9px 11px;border-radius:9px}.filters .on{background:#172033;color:white}.lesson{background:white;border:1px solid #e3e8f0;border-radius:15px;overflow:hidden}.head{padding:14px;cursor:pointer;border-bottom:1px solid #e7ebf2}.head h2{font-size:18px;margin:0}.next{font-size:12px;color:#697386}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.mini span{color:white;border-radius:8px;text-align:center;padding:6px;font-size:12px;font-weight:800}.section{padding:14px;border-bottom:1px solid #edf0f4}.section h3{font-size:15px;margin:0 0 8px}.task{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #f0f2f5}.title{font-weight:750;color:#3165ce;line-height:1.5;cursor:pointer}.detail{display:none;margin-top:8px;padding:10px;background:#f4f7ff;border-left:4px solid #3165ce;border-radius:7px;font-size:13px;line-height:1.7}.detail.open{display:block}.state{border:0;color:white;border-radius:9px;padding:8px 10px;font-weight:800;min-width:80px}.todo{background:#e5484d}.doing{background:#e8a317}.done{background:#25a55f}.raw{white-space:pre-wrap;background:#f7f9fc;padding:12px;border-radius:9px;font-size:13px;line-height:1.7;max-height:320px;overflow:auto}.collapsed .body{display:none}@media(max-width:600px){.wrap{padding:10px}.stats{gap:5px}.stat{padding:9px 6px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters button{min-height:44px}.task{display:block}.title{background:#f7f9fd;border-radius:8px;padding:10px;font-size:15px}.state{width:100%;min-height:46px;margin-top:6px}.detail{font-size:14px}.raw{font-size:14px;max-height:55vh}}</style></head><body><header><div class="wrap"><h1>授業振り返り管理</h1><div class="sub">元英弱ニキ先生｜課題・弱点・復習履歴</div><div style="margin-top:10px;display:flex;gap:8px;align-items:center;font-size:12px"><span id="firebaseStatus">Firebase読込中…</span><button id="firebaseLogin" style="border:1px solid #8993a4;background:white;color:#172033;border-radius:8px;padding:7px 10px;font-weight:700">Googleでログイン</button></div></div></header><main class="wrap"><h3>全授業の進捗</h3><div class="stats"><div class="stat r">未処理<b id="n0">0</b></div><div class="stat y">対応中<b id="n1">0</b></div><div class="stat g">済<b id="n2">0</b></div></div><div class="filters" id="globalFilters"><button class="on" data-f="all">全体</button><button data-f="todo">🔴 未処理</button><button data-f="doing">🟡 対応中</button><button data-f="done">🟢 済</button></div><article class="lesson"><div class="head"><h2>2026/09/17 指導報告</h2><div class="next">次回：9/24（木）21:00</div><div class="mini"><span class="todo">未処理 <b id="m0">0</b></span><span class="doing">対応中 <b id="m1">0</b></span><span class="done">済 <b id="m2">0</b></span></div><div class="filters" id="dateFilters"><button class="on" data-f="all">すべて</button><button data-f="todo">未処理</button><button data-f="doing">対応中</button><button data-f="done">済</button></div></div><div class="body"><section class="section"><h3>📌 今週の課題</h3><div id="hw"></div></section><section class="section"><h3>⚠️ 今回判明した弱点・復習箇所</h3><div id="wk"></div></section><section class="section"><details><summary>📝 指導報告 原文</summary><div class="raw" id="raw"></div></details></section></div></article></main><script>
const H=["Rules 2 Lesson1の復習","Rules 2 Lesson1の音読（1本30〜40回目安）","先生作成の復習ドリル","LEAP 単語テスト ＋500語程度","Rules 2 Lesson2の演習とワーク","Rules 2 Lesson3の演習とワーク（できれば）"],W=["接続詞thatの省略","so thatの3パターン","関係詞・関係副詞の前からの訳し下げ","第5文型 OC＝SV関係／準動詞","help＋原形（to省略）","自動詞・他動詞／動詞の語法","品詞判定（explosion / return / correct等）","failingなどing形の理解","倒置・doの処理"];
const D={"Rules 2 Lesson1の復習":"Lesson1で指摘された品詞・動詞の語法・that省略・so that・第5文型・倒置を見直し、説明なしで構造と訳を再現できる状態を目指します。","Rules 2 Lesson1の音読（1本30〜40回目安）":"単語の意味→文法→文構造→正しいチャンクの4段階を、一度に1つずつ意識。各段階10回程度が目安です。","先生作成の復習ドリル":"that省略、so that、関係詞・関係副詞を、構造→チャンク→訳の順で反復します。","LEAP 単語テスト ＋500語程度":"現在約1000語、テスト500番まで。来週までにさらに＋500語程度を進めます。","Rules 2 Lesson2の演習とワーク":"Lesson2を演習し、Lesson1で出た弱点が再発しないか確認します。","Rules 2 Lesson3の演習とワーク（できれば）":"Lesson1復習・ドリル・Lesson2を優先し、余力があればLesson3も進めます。","接続詞thatの省略":"Vが2つあるのに接続詞・関係詞が見えない場合、that省略を疑います。1文に時制を持つVは基本1つ。Vが増えるなら節が必要、という原則から確認します。","so thatの3パターン":"①so＋形容詞/副詞＋that＝結果、②so that＋助動詞＝目的、③カンマ＋so that＝結果。今回の文はcanがあるので目的です。","関係詞・関係副詞の前からの訳し下げ":"先行詞→関係詞/関係副詞→節の範囲→チャンクの順に取り、前から意味を積み上げます。","第5文型 OC＝SV関係／準動詞":"Cに原形不定詞・to不定詞・分詞などが来る場合、OとCの間に意味上の主語－述語関係が成立するか確認します。","help＋原形（to省略）":"help + O + (to) do。「Oが〜するのを助ける」。helpの後ではtoが省略されることがあります。","自動詞・他動詞／動詞の語法":"動詞の意味・語法→文型→後ろにO/Cのどちらが来るか、の順で判断。自他の区別は前から読むための道具です。","品詞判定（explosion / return / correct等）":"explosionを動詞、return to Earthを動詞、nail-bitingを副詞、correctを形容詞と誤認。前後関係から品詞を決め直します。","failingなどing形の理解":"道具に付くfailingは「壊れる方向へ進んでいる＝壊れかけの」。何を修飾しているかを確認します。","倒置・doの処理":"only等が文頭に出ると疑問文型の倒置になります。通常語順へ戻す際はdo/does/didを外し、動詞を適切な形に戻し、限定語を本来の位置へ戻します。"};
const raw=`【指導報告 9/17】

今回は、Rules 2のLesson1について、ご提出いただいたワークへの赤入れを口頭で一気に行いました。

単語帳のLEAPは1000語程度まで進み、テストは500番までを通した状態とのことでした。ペースとしては十分ですので、この調子で一気に2000まで持っていきましょう。

ワークの中身も、大枠は読めています。

ご本人からも「単語が分かれば大体分かる」という感触の説明がありました。実際、語彙が入っている文については訳の骨格は作れています。

一方で、品詞の取り違えから文型ごと崩れる箇所がいくつも出ました。

explosionを動詞と見てVを振ってしまった箇所、return to Earthを名詞ではなく動詞と捉えnail-bitingを副詞とした箇所、andがgrabとdrawの動詞同士を結んでいると答えきれなかった箇所、correctを形容詞と見て「修正する」という動詞の意味が出てこなかった箇所などです。

gatherについても自動詞他動詞を意識する必要があります。動詞の語法・意味が文型を決め、文型が決まれば後ろにOが来るのかCが来るのかが決まります。

構造面では、接続詞thatの省略、so thatの3パターン、第5文型のOCと準動詞、help＋原形、failing、倒置を確認しました。

接続詞thatの省略、so that、関係詞・関係副詞について復習ドリルを別途作成。音読は単語→文法→文構造→チャンクの4段階、1本30〜40回を想定。

来週までの課題は、Rules2のLesson1の復習と音読、復習ドリル、単語テスト+500語程度、Rules2のLesson2(できれば3も)の演習とワークです。

次回は9/24(木)21時です。`;
let state=JSON.parse(localStorage.getItem("eigoState")||"{}"),gf="all",df="all",syncing=false;function save(){localStorage.setItem("eigoState",JSON.stringify(state));if(window.pushShared&&!syncing)window.pushShared()}
function row(t,g,i){let id=g+i,s=state[id]||"todo";return `<div class="task" data-s="${s}"><div><div class="title" data-id="${id}">${t} ▾</div><div class="detail" id="d${id}">${D[t]}</div></div><button class="state ${s}" data-id="${id}">${s==="todo"?"未処理":s==="doing"?"対応中":"済"}</button></div>`}
function render(){hw.innerHTML=H.map((x,i)=>row(x,"h",i)).join("");wk.innerHTML=W.map((x,i)=>row(x,"w",i)).join("");document.querySelectorAll(".title").forEach(x=>x.onclick=e=>{e.stopPropagation();document.getElementById("d"+x.dataset.id).classList.toggle("open")});document.querySelectorAll(".state").forEach(b=>b.onclick=e=>{e.stopPropagation();let id=b.dataset.id,s=state[id]||"todo";state[id]=s==="todo"?"doing":s==="doing"?"done":"todo";save();render()});count();filter()}
function count(){let a=[...document.querySelectorAll(".task")],n=s=>a.filter(x=>x.dataset.s===s).length;n0.textContent=m0.textContent=n("todo");n1.textContent=m1.textContent=n("doing");n2.textContent=m2.textContent=n("done")}
function filter(){document.querySelectorAll(".task").forEach(x=>x.style.display=((gf==="all"||x.dataset.s===gf)&&(df==="all"||x.dataset.s===df))?"grid":"none")}
document.querySelectorAll("#globalFilters button").forEach(b=>b.onclick=()=>{gf=b.dataset.f;document.querySelectorAll("#globalFilters button").forEach(x=>x.classList.toggle("on",x===b));filter()});document.querySelectorAll("#dateFilters button").forEach(b=>b.onclick=e=>{e.stopPropagation();df=b.dataset.f;document.querySelectorAll("#dateFilters button").forEach(x=>x.classList.toggle("on",x===b));filter()});document.querySelector(".head").onclick=e=>{if(!e.target.closest("button"))document.querySelector(".lesson").classList.toggle("collapsed")};document.getElementById("raw").textContent=raw;render();
</script><script src="firebase-loader.js"></script><script src="firebase-auth.js"></script><script src="firebase-data.js"></script></body></html>
